name: Update private commit calendar

on:
  workflow_dispatch:
  repository_dispatch:
    types: [speed-commit]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: speed-commit-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out speed-web
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check private repository token
        env:
          SPEED_REPO_TOKEN: ${{ secrets.SPEED_REPO_TOKEN }}
        run: |
          if [ -z "$SPEED_REPO_TOKEN" ]; then
            echo "::error title=Missing repository secret::Add SPEED_REPO_TOKEN in Settings > Secrets and variables > Actions. It needs read-only Contents access to swilled/speed."
            exit 1
          fi
      - name: Generate calendar
        env:
          SPEED_REPO_TOKEN: ${{ secrets.SPEED_REPO_TOKEN }}
        run: node scripts/generate-commit-calendar.mjs --repo swilled/speed

      - name: Commit updated calendar
        run: |
          if git diff --quiet -- assets/speed-commit-calendar.svg; then
            echo "Calendar is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/speed-commit-calendar.svg
          git commit -m "chore: update speed commit calendar"
          git push
